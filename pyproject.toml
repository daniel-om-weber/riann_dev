[project]
name = "riann"
version = "0.1.0"
description = "Recurrent Inertial Attitude Neural Network — GRU-based orientation estimation from IMU data"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Daniel O.M. Weber" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tsfast>=0.3",
    "matplotlib",
    "pytorch-optimizer",
]

[project.optional-dependencies]
prep = ["scipy", "h5py", "pandas", "requests", "tqdm"]

[project.urls]
Repository = "https://github.com/daniel-om-weber/riann_dev"

[dependency-groups]
dev = [
    "line-profiler>=5.0.2",
]
